name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run existing tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify packaged distribution
        shell: bash
        run: |
          set -euo pipefail
          dist=distribution/target/full-distribution/full-distribution
          for script in "$dist"/bin/*.sh; do bash -n "$script"; done
          bash "$dist/bin/verify.sh"
          cmp LICENSE "$dist/LICENSE"
          python3 -c "import zipfile; z = zipfile.ZipFile('distribution/target/full-distribution.zip'); assert z.testzip() is None"
          jar tf "$dist/lib/database-impl-1.0.0.jar" | rg -q '^db/migration/V1__'
          test -f "$dist/config/log4j2-spring.xml"
          test -f "$dist/service/systemd/carrypigeon.service"
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: error
      - name: Save distribution
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: distribution/target/full-distribution.zip
          if-no-files-found: error
